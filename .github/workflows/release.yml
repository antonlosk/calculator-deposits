name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Calculate Next Version
        id: version
        run: |
          # Получаем последний тег (если нет - берем v0.0.0)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r -a PARTS <<< "$VERSION"
          X=${PARTS[0]:-0}
          Y=${PARTS[1]:-0}
          Z=${PARTS[2]:-0}

          # Инкрементируем патч
          Z=$((Z + 1))
          
          # Если патч > 10, сбрасываем в 0 и увеличиваем минор
          if [ $Z -gt 10 ]; then
            Z=0
            Y=$((Y + 1))
          fi

          # Если минор > 10, сбрасываем в 0 и увеличиваем мажор
          if [ $Y -gt 10 ]; then
            Y=0
            X=$((X + 1))
          fi

          NEW_VERSION="v$X.$Y.$Z"
          echo "Calculated new version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Generate debug.keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        id: rename
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APK_NAME="CalcDeposits-$VERSION-debug.apk"
          mv app/build/outputs/apk/debug/app-debug.apk $APK_NAME
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          files: ${{ steps.rename.outputs.apk_name }}
          generate_release_notes: true
